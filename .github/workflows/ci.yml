name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Compile
        run: scripts/ci-run.sh swift build

      - name: Test core logic
        run: scripts/ci-run.sh swift test

      - name: Build Drift.app (universal)
        run: ./scripts/build-app.sh --universal

      - name: Verify signature & entitlements
        run: |
          codesign --verify --strict --verbose=2 build/Drift.app
          codesign -d --entitlements - build/Drift.app
          lipo -info build/Drift.app/Contents/MacOS/Drift

      - name: Package with checksum
        run: |
          ditto -c -k --keepParent build/Drift.app build/Drift.zip
          shasum -a 256 build/Drift.zip | tee build/Drift.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Drift
          path: |
            build/Drift.zip
            build/Drift.zip.sha256
          retention-days: 30

  # The App Store build: archives Drift.xcodeproj (unsigned here; you sign
  # with your team in Xcode) and checks the bundle has what App Review needs.
  xcode-archive:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Xcode version
        run: xcodebuild -version
      - name: Project is up to date with scripts/gen-xcodeproj.py
        run: |
          python3 scripts/gen-xcodeproj.py
          git diff --exit-code -- Drift.xcodeproj || { echo "::error::Run python3 scripts/gen-xcodeproj.py and commit the result"; exit 1; }
      - name: Archive (unsigned)
        run: |
          scripts/ci-run.sh xcodebuild -project Drift.xcodeproj -scheme Drift -configuration Release \
            -destination 'generic/platform=macOS' -archivePath build/Drift.xcarchive \
            CODE_SIGNING_ALLOWED=NO archive
      - name: Check the bundle
        run: |
          APP=build/Drift.xcarchive/Products/Applications/Drift.app
          ls -la "$APP/Contents" "$APP/Contents/Resources"
          plutil -p "$APP/Contents/Info.plist"
          test -f "$APP/Contents/Resources/PrivacyInfo.xcprivacy" || { echo "::error::PrivacyInfo.xcprivacy missing"; exit 1; }
          test -f "$APP/Contents/Resources/Assets.car" || { echo "::error::Asset catalog (app icon) missing"; exit 1; }
          test -f "$APP/Contents/Resources/AppIcon.icns" || echo "::warning::No AppIcon.icns (asset catalog only)"
          /usr/libexec/PlistBuddy -c "Print :ITSAppUsesNonExemptEncryption" "$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Contents/Info.plist" | grep -q com.nweinberg.drift
          /usr/libexec/PlistBuddy -c "Print :LSApplicationCategoryType" "$APP/Contents/Info.plist"
          lipo -info "$APP/Contents/MacOS/Drift"

  # Older toolchain: Command Line Tools / Xcode 15.x ship Swift 5.10, which is
  # stricter about some concurrency patterns. Users building from source with
  # older tools must not hit compile errors.
  build-swift-5-10:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 15.4 (Swift 5.10)
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          swift --version
      - name: Compile
        run: scripts/ci-run.sh swift build -c release

  # Renders the widget and launcher in representative states and publishes
  # the PNGs to the `ci-snapshots` branch, so UI changes can be reviewed as
  # images. Only on main; the branch is overwritten each run.
  snapshots:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: scripts/ci-run.sh swift build
      - name: Render snapshots
        run: |
          mkdir -p snapshots
          set +e
          DRIFT_SNAPSHOT_DIR="$PWD/snapshots" perl -e 'alarm 240; exec @ARGV' .build/debug/Drift > snapshot.log 2>&1
          status=$?
          set -e
          cat snapshot.log
          ls -la snapshots
          if [ $status -ne 0 ] || [ -z "$(ls snapshots)" ]; then
            tail -n 12 snapshot.log | while IFS= read -r line; do echo "::warning::${line}"; done
            echo "::error::Snapshot run exited with $status"
            exit 1
          fi
      - name: Publish to ci-snapshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd snapshots
          printf "Widget snapshots for %s\n" "$GITHUB_SHA" > README.md
          git init -q
          git checkout -q -b ci-snapshots
          git add .
          git -c user.name="drift-ci" -c user.email="drift-ci@users.noreply.github.com" commit -qm "Snapshots for $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots
