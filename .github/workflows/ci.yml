name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege: the workflow can read the repo and nothing else.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Toolchain
        run: |
          sw_vers
          swift --version

      - name: Compile
        run: scripts/ci-run.sh swift build

      - name: Test core logic
        run: scripts/ci-run.sh swift test

      - name: Build Drift.app (universal)
        run: ./scripts/build-app.sh --universal

      - name: Verify signature & entitlements
        run: |
          codesign --verify --strict --verbose=2 build/Drift.app
          codesign -d --entitlements - build/Drift.app
          lipo -info build/Drift.app/Contents/MacOS/Drift

      - name: Package with checksum
        run: |
          ditto -c -k --keepParent build/Drift.app build/Drift.zip
          shasum -a 256 build/Drift.zip | tee build/Drift.zip.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: Drift
          path: |
            build/Drift.zip
            build/Drift.zip.sha256
          retention-days: 30

  # Older toolchain: Command Line Tools / Xcode 15.x ship Swift 5.10, which is
  # stricter about some concurrency patterns. Users building from source with
  # older tools must not hit compile errors.
  build-swift-5-10:
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Select Xcode 15.4 (Swift 5.10)
        run: |
          sudo xcode-select -s /Applications/Xcode_15.4.app
          swift --version
      - name: Compile
        run: scripts/ci-run.sh swift build -c release

  # Renders the widget and launcher in representative states and publishes
  # the PNGs to the `ci-snapshots` branch, so UI changes can be reviewed as
  # images. Only on main; the branch is overwritten each run.
  snapshots:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build
        run: scripts/ci-run.sh swift build
      - name: Render snapshots
        run: |
          mkdir -p snapshots
          DRIFT_SNAPSHOT_DIR="$PWD/snapshots" timeout 180 .build/debug/Drift
          ls -la snapshots
      - name: Publish to ci-snapshots branch
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cd snapshots
          printf "Widget snapshots for %s\n" "$GITHUB_SHA" > README.md
          git init -q
          git checkout -q -b ci-snapshots
          git add .
          git -c user.name="drift-ci" -c user.email="drift-ci@users.noreply.github.com" commit -qm "Snapshots for $GITHUB_SHA"
          git push -fq "https://x-access-token:${TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ci-snapshots
